name: zhenyi-accounts
services:
  postgres:
    image: postgres:17-alpine@sha256:0b2882c46a2b8d8e148431b333394348cf4d7f15aec6df7f17d51dc641e56cfa
    restart: unless-stopped
    ports: ["127.0.0.1:5342:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run setup}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:?run npm run setup}
      ENTITLEMENTS_DB_PASSWORD: ${ENTITLEMENTS_DB_PASSWORD:?run npm run setup}
    volumes:
      - accounts-postgres:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-accounts.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  # Optional Linux / registry-available runtime. Local start uses the official, checksum-verified Darwin binary.
  casdoor:
    profiles: ["docker-casdoor"]
    image: casbin/casdoor:v4.22.0
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:5300:8000"]
    volumes:
      - ../.local/casdoor-docker/app.conf:/conf/app.conf:ro
      - ../.local/casdoor-docker/init_data.json:/init_data.json:ro
volumes:
  accounts-postgres:
networks:
  default:
    ipam:
      config:
        - subnet: 10.236.0.0/24
